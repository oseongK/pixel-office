<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Office</title>
    <style>
      :root {
        --po-font:
          'Galmuri11', 'DungGeunMo', 'NeoDunggeunmo', 'Malgun Gothic', 'Apple SD Gothic Neo',
          sans-serif;
      }
      html,
      body {
        margin: 0;
        background: #1d2b53;
        font-family: var(--po-font);
      }
      .po {
        position: relative;
        width: 100%;
        background: #1d2b53;
        border: 3px solid #0e1430;
        box-sizing: border-box;
        user-select: none;
      }
      .po-stage {
        position: relative;
        line-height: 0;
      }
      .po canvas.po-world {
        display: block;
        image-rendering: pixelated;
        outline: none;
      }
      .po canvas.po-world:focus-visible {
        box-shadow: inset 0 0 0 2px #ffd23f;
      }
      .po-input {
        position: absolute;
        display: none;
        width: 180px;
        transform: translateX(-50%);
        padding: 4px 6px;
        border: 2px solid #0e1430;
        background: #fff;
        font: 13px var(--po-font);
        line-height: 1.2;
        outline: none;
      }
      .po-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 10px;
        background: #0e1430;
        color: #fff;
        font-size: 12px;
      }
      .po-select {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .po-select button {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 2px solid #fff;
        background: #e43b44;
        color: #fff;
        font: bold 12px var(--po-font);
        cursor: pointer;
      }
      .po-select button:hover {
        background: #ff5d66;
      }
      .po-select canvas {
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
      }
      .po-name {
        min-width: 110px;
      }
      .po-hint {
        opacity: 0.7;
      }
      .po-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin: 0 4px 0 8px;
      }
    </style>
  </head>
  <body>
    <div class="po" id="pixel-office">
      <div class="po-stage">
        <canvas
          class="po-world"
          tabindex="0"
          aria-label="Pixel Office. 클릭 후 화살표로 이동, Enter로 말하기"
        ></canvas>
        <input class="po-input" type="text" maxlength="40" placeholder="메시지 입력 후 Enter" />
      </div>
      <div class="po-bar">
        <div class="po-select">
          <button type="button" class="po-prev" aria-label="이전 캐릭터">◀</button>
          <canvas class="po-preview" width="16" height="16"></canvas>
          <button type="button" class="po-next" aria-label="다음 캐릭터">▶</button>
          <span class="po-name"></span>
        </div>
        <span class="po-hint">클릭 → ←→ 이동 · ↑ 점프 · Enter 말하기</span>
        <span class="po-count"></span>
      </div>
    </div>

        const CHAR_INDEX = new Map(CHARACTERS.map((c, i) => [c.id, i]));

        function paint(rows, palette) {
          const c = document.createElement('canvas');
          c.width = c.height = 16;
          const g = c.getContext('2d');
          rows.forEach((row, y) => {
            for (let x = 0; x < 16; x++) {
              const col = palette[row[x]];
              if (!col) continue;
              g.fillStyle = col;
              g.fillRect(x, y, 1, 1);
            }
          });
          return c;
        }

        function mirror(src) {
          const c = document.createElement('canvas');
          c.width = c.height = 16;
          const g = c.getContext('2d');
          g.translate(16, 0);
          g.scale(-1, 1);
          g.drawImage(src, 0, 0);
          return c;
        }

        // spriteCache[id] = [[frame0Right, frame0Left], [frame1Right, frame1Left]]
        const spriteCache = new Map();
        function sprite(charId, frame, facing) {
          let s = spriteCache.get(charId);
          if (!s) {
            const def = CHARACTERS[CHAR_INDEX.get(charId) ?? 0];
            const body = BODIES[def.body];
            const palette = { ...body.palette, ...def.pal };
            const base = body.rows.slice();
            if (def.hat) HATS[def.hat].forEach((r, i) => (base[i] = r));
            const alt = base.slice();
            body.alt.rows.forEach((r, i) => (alt[body.alt.from + i] = r));
            s = [base, alt].map((rows) => {
              const right = paint(rows, palette);
              return [right, mirror(right)];
            });
            spriteCache.set(charId, s);
          }
          return s[frame][facing === -1 ? 1 : 0];
        }

        const ID_RE = /^[A-Za-z0-9_.-]{1,32}$/;

        const CONTROL_RE = /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g;

        function cleanText(t, max) {
          if (typeof t !== 'string') return null;
          const s = [...t.replace(CONTROL_RE, '').trim()].slice(0, max).join('');
          return s || null;
        }
        const validId = (id) => typeof id === 'string' && ID_RE.test(id);
        const validStatus = (s) => s === 'online' || s === 'offline';
        const validChar = (c) => typeof c === 'string' && CHAR_INDEX.has(c);

          let h = 0;
          for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
          return CHARACTERS[h % CHARACTERS.length].id;
        }

        function parseUrl(v, protocols) {
          if (!v) return null;
          try {
            const u = new URL(v);
            return protocols.includes(u.protocol) ? u : null;
          } catch {
            return null;
          }

          parseUrl(params.get('parentOrigin'), ['http:', 'https:'])?.origin ?? location.origin;
        const DEMO = !WS_URL && params.get('demo') !== '0';

        const canvas = root.querySelector('.po-world');
        const ctx = canvas.getContext('2d');
        const input = root.querySelector('.po-input');
        const preview = root.querySelector('.po-preview');
        const nameEl = root.querySelector('.po-name');
        const countEl = root.querySelector('.po-count');

        const GROUND = 96;
        let W = 384;
        let scale = 1;
        let px = 1;

        function resize() {
          const cw = root.clientWidth || 384;
          const oldW = W;
          if (cw >= 384) {
            scale = Math.min(3, Math.floor(cw / 384));
            W = Math.floor(cw / scale);
          } else {
            scale = cw / 384;
            W = 384;
          }
          const dpr = window.devicePixelRatio || 1;
          px = scale * dpr;
          canvas.style.width = W * scale + 'px';
          canvas.style.height = H * scale + 'px';
          canvas.width = Math.round(W * px);
          canvas.height = Math.round(H * px);
          if (W === oldW) return;
          // 존 좌표가 바뀌므로 위치는 비율 유지, 진행 중 목표는 새 존 기준으로 다시 잡는다
          for (const e of entities.values()) {
            e.x = Math.max(4, Math.min(W - 4, (e.x / oldW) * W));
            if (e.target == null) continue;
            if (e.isMe && !e.autopilot) e.target = null;
            else e.target = rand(...zoneFor(e.status));
          }
        }

        const zones = {
          home: () => [16, 104],
          office: () => [W - 108, W - 16],
        };

        function zoneOf(x) {
          const [h0, h1] = zones.home();
          const [o0, o1] = zones.office();
          if (x >= h0 - 8 && x <= h1 + 8) return 'home';
          if (x >= o0 - 8 && x <= o1 + 8) return 'office';
          return 'road';
        }
        const rand = (a, b) => a + Math.random() * (b - a);

        const entities = new Map();

          try {
            const v = localStorage.getItem(STORE_KEY);
            return validChar(v) ? v : null;
          } catch {
            return null;
          }
        }

        function upsert(u) {
          if (!u || !validId(u.id)) return null;
          let e = entities.get(u.id);
          if (!e) {
            const status = validStatus(u.status) ? u.status : 'offline';
            const [a, b] = zoneFor(status);
            e = {
              id: u.id,
              name: u.id,
              status,
              characterId: defaultChar(u.id),
              x: rand(a, b),
              y: 0,
              vy: 0,
              facing: 1,
              target: null,
              remoteNX: null,
              fromRoster: false,
              autopilot: false,
              walking: false,
              wanderAt: performance.now() + rand(500, 4000),
              bubble: null,
              isMe: u.id === ME,
            };
            entities.set(u.id, e);
          }
          const name = cleanText(u.name, 20);
          if (name) e.name = name;
          if (validStatus(u.status) && u.status !== e.status) setStatus(e, u.status);
          if (validChar(u.characterId) && !(e.isMe && storedChar())) e.characterId = u.characterId;
          if (!e.isMe && typeof u.x === 'number' && Number.isFinite(u.x)) {
            e.remoteNX = Math.max(0, Math.min(1, u.x));
          }
          return e;
        }

        function setStatus(e, status) {
          e.status = status;
          e.remoteNX = null;
          const [a, b] = zoneFor(status);
          e.target = rand(a, b);
          if (e.isMe) e.autopilot = true;
        }

        function say(e, text) {
          e.bubble = { text, until: performance.now() + 5000 };
        }

        // ───────── 네트워크 ─────────
        let ws = null;
        let connected = false;
        let backoff = 1000;
        let lastSentX = null;
        let lastSentFacing = null;
        let lastSentAt = 0;

        function send(msg) {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
        }

        function connect() {
          if (!WS_URL) return;
          try {
            ws = new WebSocket(WS_URL);
          } catch {
            return;
          }
          ws.onopen = () => {
            connected = true;
            backoff = 1000;
            send({ type: 'hello', id: ME });
            const c = storedChar();
            if (c) send({ type: 'char', characterId: c });
            lastSentX = null;
            lastSentFacing = null;
          };
          ws.onmessage = (ev) => {
            let m;
            try {
              m = JSON.parse(ev.data);
            } catch {
              return;
            }
            handleServer(m);
          };
          ws.onclose = () => {
            connected = false;
            setTimeout(connect, backoff);
            backoff = Math.min(backoff * 2, 30000);
          };
        }

        function handleServer(m) {
          if (!m || typeof m !== 'object') return;
          const e = validId(m.id) ? entities.get(m.id) : null;
          switch (m.type) {
            case 'snapshot':
              if (Array.isArray(m.users)) m.users.slice(0, 500).forEach(upsert);
              break;
            case 'move':
              if (e && !e.isMe && typeof m.x === 'number' && Number.isFinite(m.x)) {
                e.remoteNX = Math.max(0, Math.min(1, m.x));
                e.facing = m.facing === -1 ? -1 : 1;
                if (e.punish) e.punish.moved = true;
              }
              break;
            case 'chat': {
              const text = cleanText(m.text, MAX_CHAT);
              if (e && text && !(e.isMe && e.bubble?.text === text)) say(e, text);
              break;
            }
            case 'char':
              if (e && validChar(m.characterId) && !e.isMe) e.characterId = m.characterId;
              break;
            case 'punish':
              if (e && !e.isMe && !e.punish) startPunish(e, false, m.effect, m.to);
              break;
            case 'leave':
              if (e && !e.isMe) e.remoteNX = null;
              break;
            case 'status':
              if (e && validStatus(m.status) && m.status !== e.status) setStatus(e, m.status);
              break;
          }
        }

        window.addEventListener('message', (ev) => {
          if (ev.origin !== PARENT_ORIGIN) return;
          if (ev.source !== window.parent && ev.source !== window) return;
          const m = ev.data;
          if (!m || typeof m !== 'object') return;
          if (m.type === 'pixel-office:roster' && Array.isArray(m.users)) {
            const ids = new Set();
            m.users.slice(0, 500).forEach((u) => {
              const e = upsert(u);
              if (!e) return;
              e.fromRoster = true;
              ids.add(e.id);
            });
            for (const e of [...entities.values()]) {
              if (e.fromRoster && !ids.has(e.id) && !e.isMe) entities.delete(e.id);
            }
          } else if (m.type === 'pixel-office:status') {
            const e = validId(m.id) ? entities.get(m.id) : null;
            if (e && validStatus(m.status) && m.status !== e.status) setStatus(e, m.status);
          }
        });

        // ───────── 입력 ─────────
        const keys = new Set();
        const CHAT_INTERVAL = 600;
        let chatting = false;
        let lastChatAt = -Infinity;

        canvas.addEventListener('keydown', (ev) => {
          if (chatting || entities.get(ME)?.punish) {
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' '].includes(ev.key)) ev.preventDefault();
            return;
          }
          if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' '].includes(ev.key)) {
            ev.preventDefault();
            keys.add(ev.key);
          } else if (ev.key === 'Enter') {
            ev.preventDefault();
            openChat();
          }
        });
        canvas.addEventListener('keyup', (ev) => keys.delete(ev.key));
        canvas.addEventListener('blur', () => keys.clear());
        canvas.addEventListener('mousedown', () => canvas.focus());

        function openChat() {
          const me = entities.get(ME);
          if (!me || me.punish) return;
          chatting = true;
          keys.clear();
          input.value = '';
          input.style.display = 'block';
          input.style.left = Math.max(90, Math.min(W * scale - 90, me.x * scale)) + 'px';
          input.style.top = Math.max(0, (GROUND - 46) * scale) + 'px';
          input.focus();
        }

        function closeChat() {
          chatting = false;
          input.style.display = 'none';
          canvas.focus();
        }

        input.addEventListener('keydown', (ev) => {
          ev.stopPropagation();
          if (ev.isComposing) return;
          if (ev.key === 'Enter') {
            ev.preventDefault();
            const text = cleanText(input.value, MAX_CHAT);
            const me = entities.get(ME);
            const now = performance.now();
            if (text && me && now - lastChatAt >= CHAT_INTERVAL) {
              lastChatAt = now;
              say(me, text);
              send({ type: 'chat', text });
            }
            closeChat();
          } else if (ev.key === 'Escape') {
            closeChat();
          }
        });
        input.addEventListener('blur', () => {
          if (chatting) {
            chatting = false;
            input.style.display = 'none';
          }
        });

        // ───────── 캐릭터 선택 ─────────
        function myChar() {
          return entities.get(ME)?.characterId ?? CHARACTERS[0].id;
        }

        function pick(delta) {
          const me = entities.get(ME);
          if (!me) return;
          const i =
            (CHAR_INDEX.get(me.characterId) + delta + CHARACTERS.length) % CHARACTERS.length;
          me.characterId = CHARACTERS[i].id;
          try {
            localStorage.setItem(STORE_KEY, me.characterId);
          } catch {
            /* localStorage 차단 환경 */
          }
          send({ type: 'char', characterId: me.characterId });
          renderBar();
        }
        root.querySelector('.po-prev').addEventListener('click', () => pick(-1));
        root.querySelector('.po-next').addEventListener('click', () => pick(1));

        let lastBar = '';
        function renderBar() {
          const cid = myChar();
          let on = 0;
          for (const e of entities.values()) if (e.status === 'online') on++;
          const key = cid + '|' + on + '|' + entities.size;
          if (key === lastBar) return;
          lastBar = key;
          const pg = preview.getContext('2d');
          pg.clearRect(0, 0, 16, 16);
          pg.drawImage(sprite(cid, 0, 1), 0, 0);
          const i = CHAR_INDEX.get(cid);
          nameEl.textContent = `${i + 1}/${CHARACTERS.length} ${CHARACTERS[i].name}`;
          countEl.replaceChildren(
            dot('#3fdc5a'),
            `Online ${on}`,
            dot('#8a8f98'),
            `Offline ${entities.size - on}`,
          );
        }
        function dot(color) {
          const s = document.createElement('span');
          s.className = 'po-dot';
          s.style.background = color;
          return s;
        }

        // ───────── 업데이트 ─────────
        // ───────── 퇴근 방지 효과 ─────────
        // 출근 상태에서 직접 걸어서 집 쪽으로 PUNISH_RANGE 안에 들어가면 EFFECTS 중 하나가 무작위로 재생된다.
        // 본인 화면이 효과와 도착 위치(to, 0~1)를 정해 punish 메시지로 보내므로 모든 화면이 같은 연출을 본다.
        const PUNISH_RANGE = 20;
        let lastEffect = null;

        // 서버는 effect 형식만 검사하므로 'constructor' 같은 상속 키를 여기서 걸러야 한다
        const isEffect = (n) => typeof n === 'string' && Object.hasOwn(EFFECTS, n);

        function pickEffect() {
          const forced = window.__pixelOfficeForceEffect;
          if (isEffect(forced)) return forced;
          const pool = EFFECT_NAMES.filter((n) => n !== lastEffect);
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function startPunish(e, local, effect, to) {
          const now = performance.now();
          if (local) {
            effect = pickEffect();
            to = rand(...zones.office()) / W;
          }
          if (!isEffect(effect)) effect = 'mace';
          if (typeof to !== 'number' || !Number.isFinite(to)) to = rand(...zones.office()) / W;
          to = Math.max(0, Math.min(1, to));
          if (local) lastEffect = effect;
          // 관전자는 보간 중인 e.x 대신 직전 move 로 받은 정확한 위치에서 시작한다
          const fromX = !local && e.remoteNX != null ? e.remoteNX * W : e.x;
          e.x = fromX;
          e.punish = { start: now, effect, fromX, toNX: to, moved: false };
          e.bubble = null;
          e.walking = false;
          e.target = null;
          e.autopilot = false;
          e.vy = 0;
          e.y = 0;
          if (local) {
            keys.clear();
            // 직전 위치를 먼저 보내 관전자의 시작 위치를 맞춘다
            sendMove(e, now);
            send({ type: 'punish', effect, to: Math.round(to * 10000) / 10000 });
          }
        }

        function endPunish(e, now) {
          const { toNX: to, moved } = e.punish;
          e.punish = null;
          e.facing = -1;
          e.blinkUntil = now + 1000;
          if (e.isMe) {
            keys.clear();
            // 연출 중 퇴근 처리됐으면 집으로
            e.x = e.status === 'online' ? to * W : rand(...zoneFor(e.status));
          } else if (e.status !== 'online') {
            // 연출 중 퇴근 처리됨 → 집으로
            e.x = to * W;
            e.remoteNX = null;
            e.target = rand(...zoneFor(e.status));
          } else {
            // 본인은 연출 중 멈춰 있으므로, 연출 중 받은 move 는 부활 이후 위치다
            e.x = to * W;
            if (!moved) e.remoteNX = to;
          }
        }

        const SPEED_ME = 70;
        const SPEED_COMMUTE = 55;
        const SPEED_WANDER = 18;
        const GRAVITY = 420;

        function step(e, dt, now) {
          let goal = null;
          let speed = SPEED_WANDER;

          if (e.punish) {
            if (now - e.punish.start >= EFFECTS[e.punish.effect].duration) endPunish(e, now);
            return;
          }

          if (e.isMe) {
            const dir = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
            // 출근 상태에서 직접 걸어서 집 쪽으로 다가가면 퇴근 방지 효과
            if (dir < 0 && e.status === 'online' && e.x <= zones.home()[1] + PUNISH_RANGE) {
              startPunish(e, true);
              return;
            }
            if ((keys.has('ArrowUp') || keys.has(' ')) && e.y === 0) e.vy = -150;
            if (dir) {
              e.autopilot = false;
              e.target = null;
              e.facing = dir;
              e.x = Math.max(4, Math.min(W - 4, e.x + dir * SPEED_ME * dt));
              e.walking = true;
            } else if (e.autopilot && e.target != null) {
              goal = e.target;
              speed = SPEED_COMMUTE;
            } else {
              e.walking = false;
            }
            if (e.vy || e.y) {
              e.vy += GRAVITY * dt;
              e.y = Math.min(0, e.y + e.vy * dt);
              if (e.y === 0) e.vy = 0;
            }
          } else if (e.remoteNX != null) {
            goal = e.remoteNX * W;
            speed = Math.max(SPEED_ME, Math.abs(goal - e.x) * 4);
          } else {
            if (e.target == null && now > e.wanderAt) {
              const [a, b] = zoneFor(e.status);
              e.target = Math.random() < 0.6 ? rand(a, b) : null;
              e.wanderAt = now + rand(2500, 7000);
            }
            if (e.target != null) {
              goal = e.target;
              speed =
                zoneOf(e.x) === (e.status === 'online' ? 'office' : 'home')
                  ? SPEED_WANDER
                  : SPEED_COMMUTE;
            }
          }

          if (goal != null) {
            const d = goal - e.x;
            if (Math.abs(d) < 0.5) {
              e.x = goal;
              e.walking = false;
              if (e.remoteNX == null) e.target = null;
              if (e.isMe) e.autopilot = false;
            } else {
              e.facing = d > 0 ? 1 : -1;
              e.x += Math.sign(d) * Math.min(Math.abs(d), speed * dt);
              e.walking = true;
            }
          }

          if (e.bubble && now > e.bubble.until) e.bubble = null;
        }

        function syncMe(now) {
          const me = entities.get(ME);
          if (!me || !connected) return;
          const nx = Math.round((me.x / W) * 10000) / 10000;
          if ((nx !== lastSentX || me.facing !== lastSentFacing) && now - lastSentAt >= 100) {
            sendMove(me, now);
          }
        }

        function sendMove(me, now) {
          const nx = Math.round((me.x / W) * 10000) / 10000;
          send({ type: 'move', x: nx, facing: me.facing });
          lastSentX = nx;
          lastSentFacing = me.facing;
          lastSentAt = now;
        }

        // ───────── 그리기 ─────────
        function skyColors() {
          const h = new Date().getHours();
          if (h >= 7 && h < 17) return { sky: '#6cb4ff', night: false };
          if (h >= 17 && h < 19) return { sky: '#f39c6b', night: false };
          if (h >= 5 && h < 7) return { sky: '#9fb7e8', night: false };
          return { sky: '#1d2b53', night: true };
        }

        const clouds = Array.from({ length: 6 }, (_, i) => ({
          x: i * 90 + rand(0, 40),
          y: rand(6, 30),
          s: rand(3, 7),
        }));
        const stars = Array.from({ length: 40 }, () => [Math.random(), rand(2, 60)]);

        function rect(x, y, w, h, c) {
          ctx.fillStyle = c;
          ctx.fillRect(x, y, w, h);
        }

        function drawCloud(x, y) {
          rect(x + 4, y, 12, 4, '#fff');
          rect(x, y + 4, 24, 4, '#fff');
          rect(x + 2, y + 8, 20, 2, '#dfefff');
        }

        function drawHills() {
          ctx.fillStyle = '#4fa75a';
          for (let x = -20; x < W; x += 140) {
            ctx.beginPath();
            ctx.moveTo(x, GROUND);
            ctx.lineTo(x + 40, GROUND - 26);
            ctx.lineTo(x + 52, GROUND - 26);
            ctx.lineTo(x + 92, GROUND);
            ctx.fill();
          }
        }

        function drawHouse(night) {
          const x = 22;
          rect(x, GROUND - 34, 64, 34, '#e8d3a8');
          for (let y = GROUND - 34; y < GROUND; y += 4) rect(x, y, 64, 1, '#d4bc8c');
          ctx.fillStyle = '#c0392b';
          ctx.beginPath();
          ctx.moveTo(x - 6, GROUND - 34);
          ctx.lineTo(x + 32, GROUND - 58);
          ctx.lineTo(x + 70, GROUND - 34);
          ctx.fill();
          rect(x + 48, GROUND - 56, 8, 14, '#7a4b2a');
          rect(x + 26, GROUND - 20, 12, 20, '#7a4b2a');
          rect(x + 35, GROUND - 11, 2, 2, '#ffd23f');
          const win = night ? '#ffe08a' : '#9fd8ff';
          rect(x + 6, GROUND - 26, 12, 10, '#5a3a22');
          rect(x + 7, GROUND - 25, 10, 8, win);
          rect(x + 46, GROUND - 26, 12, 10, '#5a3a22');
          rect(x + 47, GROUND - 25, 10, 8, win);
          label('HOME', x + 32, GROUND - 62);
        }

        function drawOffice(night) {
          const x = W - 100;
          rect(x, GROUND - 76, 84, 76, '#5b6b8c');
          rect(x, GROUND - 76, 84, 3, '#3d4a66');
          for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 6; c++) {
              const lit = night ? (r * 7 + c * 3) % 4 !== 0 : false;
              rect(x + 6 + c * 13, GROUND - 68 + r * 10, 8, 6, lit ? '#ffe08a' : '#9fd8ff');
            }
          }
          rect(x + 32, GROUND - 12, 20, 12, '#2c3550');
          rect(x + 41, GROUND - 12, 2, 12, '#9fd8ff');
          label('OFFICE', x + 42, GROUND - 80);
        }

        function drawTree(x) {
          rect(x + 6, GROUND - 12, 4, 12, '#7a4b2a');
          rect(x, GROUND - 26, 16, 14, '#2e9e44');
          rect(x + 3, GROUND - 30, 10, 4, '#2e9e44');
          rect(x + 2, GROUND - 24, 4, 3, '#4cbb4c');
        }

        function drawGround() {
          rect(-4, GROUND, W + 8, H - GROUND + 4, '#c8743a');
          rect(0, GROUND, W, 3, '#5ed36a');
          rect(0, GROUND + 3, W, 1, '#2e9e44');
          ctx.fillStyle = '#a85a28';
          for (let x = 0; x < W; x += 8) {
            ctx.fillRect(x, GROUND + 4, 1, H - GROUND);
          }
          for (let y = GROUND + 8; y < H; y += 6) ctx.fillRect(0, y, W, 1);
          // 출퇴근 길
          const r0 = zones.home()[1] + 12;
          const r1 = zones.office()[0] - 12;
          for (let x = r0; x < r1; x += 10) rect(x, GROUND + 1, 5, 1, '#fff5c0');
        }

        function setFont(size, weight = '') {
          ctx.font = `${weight} ${size}px ${FONT_FAMILY}`;
        }

        function label(text, cx, y) {
          setFont(6, 'bold');
          const w = ctx.measureText(text).width + 6;
          rect(Math.round(cx - w / 2), y - 6, Math.round(w), 8, '#0e1430');
          ctx.fillStyle = '#ffd23f';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, cx, y - 2);
        }

        function wrap(text, maxW) {
          const lines = [];
          let line = '';
          // 공백 단위로 줄바꿈하고, 한 단어가 너무 길면 글자 단위로 자른다
          for (const word of text.split(/(?<= )/)) {
            if (ctx.measureText(line + word).width <= maxW) {
              line += word;
              continue;
            }
            if (line) lines.push(line.trimEnd());
            line = '';
            for (const ch of word) {
              if (ctx.measureText(line + ch).width > maxW && line) {
                lines.push(line);
                line = ch;
              } else line += ch;
            }
          }
          if (line) lines.push(line);
          return lines.slice(0, 6);
        }

        function drawBubble(e) {
          setFont(6);
          const lines = wrap(e.bubble.text, 96);
          const tw = Math.max(...lines.map((l) => ctx.measureText(l).width));
          const bw = Math.ceil(tw) + 8;
          const bh = lines.length * 7 + 5;
          const bx = Math.round(Math.max(1, Math.min(W - bw - 1, e.x - bw / 2)));
          const by = Math.round(GROUND - 22 + e.y - bh);
          rect(bx, by, bw, bh, '#0e1430');
          rect(bx + 1, by + 1, bw - 2, bh - 2, '#ffffff');
          const tx = Math.round(Math.max(bx + 3, Math.min(bx + bw - 6, e.x - 2)));
          rect(tx, by + bh - 1, 4, 2, '#ffffff');
          rect(tx + 1, by + bh + 1, 2, 2, '#0e1430');
          rect(tx - 1, by + bh - 1, 1, 2, '#0e1430');
          rect(tx + 4, by + bh - 1, 1, 2, '#0e1430');
          ctx.fillStyle = '#0e1430';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          lines.forEach((l, i) => ctx.fillText(l, bx + 4, by + 3 + i * 7));
        }

        function drawMace(cx, cy) {
          rect(cx - 1, cy - 20, 2, 14, '#7a4b2a');
          rect(cx - 2, cy - 21, 4, 2, '#5a3a22');
          rect(cx - 1, cy - 8, 2, 2, '#3d4450');
          rect(cx - 1, cy + 5, 2, 2, '#3d4450');
          rect(cx - 7, cy - 1, 2, 2, '#3d4450');
          rect(cx + 5, cy - 1, 2, 2, '#3d4450');
          rect(cx - 5, cy - 5, 2, 2, '#3d4450');
          rect(cx + 3, cy - 5, 2, 2, '#3d4450');
          rect(cx - 5, cy + 3, 2, 2, '#3d4450');
          rect(cx + 3, cy + 3, 2, 2, '#3d4450');
          rect(cx - 4, cy - 3, 8, 7, '#8a8f98');
          rect(cx - 3, cy - 5, 6, 11, '#8a8f98');
          rect(cx - 5, cy - 2, 10, 5, '#8a8f98');
          rect(cx - 2, cy - 3, 2, 2, '#d0d4da');
        }

        const clamp01 = (k) => Math.max(0, Math.min(1, k));
        const lerp = (a, b, k) => a + (b - a) * k;
        const phase = (t, a, b) => clamp01((t - a) / (b - a));
        const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2);
        const doorX = () => W - 58;

        function drawChar(e, cx, footY, frame = 0, facing = e.facing) {
          const img = sprite(e.characterId, frame, facing);
          ctx.drawImage(img, Math.round(cx - 8), Math.round(footY - 16));
        }

        // 스프라이트 맨 위 불투명 행 (슬라임처럼 위가 비어 있는 몸체용)
        const topCache = new Map();
        function spriteTop(charId) {
          if (!topCache.has(charId)) {
            const def = CHARACTERS[CHAR_INDEX.get(charId) ?? 0];
            const rows = BODIES[def.body].rows.slice();
            if (def.hat) HATS[def.hat].forEach((r, i) => (rows[i] = r));
            topCache.set(
              charId,
              Math.max(
                0,
                rows.findIndex((r) => /[^.]/.test(r)),
              ),
            );
          }
          return topCache.get(charId);
        }

        // 번개 맞은 캐릭터용 검은 실루엣 (캐릭터별 캐시)
        const charredCache = new Map();
        function charred(charId, facing) {
          const key = `${charId}|${facing}`;
          let c = charredCache.get(key);
          if (!c) {
            c = document.createElement('canvas');
            c.width = c.height = 16;
            const g = c.getContext('2d');
            g.drawImage(sprite(charId, 0, facing), 0, 0);
            g.globalCompositeOperation = 'source-in';
            g.fillStyle = '#26232a';
            g.fillRect(0, 0, 16, 16);
            g.globalCompositeOperation = 'source-over';
            g.fillStyle = '#ffffff';
            g.fillRect(facing === -1 ? 5 : 9, 4, 1, 1);
            charredCache.set(key, c);
          }
          return c;
        }

        function drawBanner(text, { x, top }) {
          setFont(8, 'bold');
          const w = Math.ceil(ctx.measureText(text).width) + 10;
          const bx = Math.round(Math.max(1, Math.min(W - w - 1, x - w / 2)));
          const by = Math.round(Math.max(2, top - 16));
          rect(bx, by, w, 12, '#0e1430');
          rect(bx + 1, by + 1, w - 2, 10, '#e43b44');
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, bx + w / 2, by + 6.5);
        }

        function drawStars(cx, cy, now) {
          for (let i = 0; i < 3; i++) {
            const a = now / 150 + (i * Math.PI * 2) / 3;
            rect(
              Math.round(cx + Math.cos(a) * 9),
              Math.round(cy + Math.sin(a) * 3),
              2,
              2,
              '#ffd23f',
            );
          }
        }

        function drawPoof(cx, k) {
          const r = 2 + 10 * k;
          ctx.globalAlpha = 1 - k;
          for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI) / 4;
            rect(
              Math.round(cx + Math.cos(a) * r - 2),
              Math.round(GROUND - 9 + Math.sin(a) * r * 0.6 - 2),
              4,
              4,
              '#eeeeee',
            );
          }
          ctx.globalAlpha = 1;
        }

        function drawClaw(cx, cy, open) {
          cx = Math.round(cx);
          cy = Math.round(cy);
          rect(cx, -4, 1, cy - 2, '#3d4450');
          rect(cx - 5, cy - 7, 11, 4, '#0e1430');
          rect(cx - 4, cy - 6, 9, 2, '#c0c7d1');
          const c = '#8a8f98';
          if (open) {
            rect(cx - 6, cy - 4, 2, 3, c);
            rect(cx - 8, cy - 2, 2, 4, c);
            rect(cx + 5, cy - 4, 2, 3, c);
            rect(cx + 7, cy - 2, 2, 4, c);
          } else {
            rect(cx - 5, cy - 4, 2, 4, c);
            rect(cx - 4, cy, 2, 2, c);
            rect(cx + 4, cy - 4, 2, 4, c);
            rect(cx + 3, cy, 2, 2, c);
          }
        }

        function drawBolt(x, endY) {
          const pts = [
            [x + 6, -4],
            [x - 4, 22],
            [x + 4, 38],
            [x - 6, 58],
            [x + 2, 72],
            [x, endY],
          ];
          for (const [w, c] of [
            [3, '#ffd23f'],
            [1, '#ffffff'],
          ]) {
            ctx.strokeStyle = c;
            ctx.lineWidth = w;
            ctx.beginPath();
            pts.forEach(([px2, py], i) => (i ? ctx.lineTo(px2, py) : ctx.moveTo(px2, py)));
            ctx.stroke();
          }
        }

        // 효과별 타임라인(ms). draw 는 캐릭터 대신 그려지고, overlay 는 모든 캐릭터 위에 그려진다.
        // anchor 는 배너 위치 {x, top}. 연출이 끝나면 endPunish 가 도착 위치(toNX)에 캐릭터를 둔다.
        const EFFECTS = {
          mace: {
            duration: 2200,
            shake: [700, 1000],
            text: '일해라 노예야!',
            textAt: [700, 2200],
            anchor: (e) => ({ x: e.punish.fromX, top: GROUND - 34 }),
            draw(e, t, now) {
              const x = e.punish.fromX;
              if (t < 700) {
                drawChar(e, x, GROUND);
                const k = t / 700;
                drawMace(Math.round(x), Math.round(-20 + (GROUND - 2) * k * k));
                return;
              }
              const img = sprite(e.characterId, 0, e.facing);
              ctx.drawImage(img, Math.round(x - 11), GROUND - 6, 22, 6);
              drawMace(Math.round(x), GROUND - 12);
              drawStars(x, GROUND - 24, now);
            },
          },

          claw: {
            duration: 3000,
            text: '아직 집에 못가요~',
            textAt: [700, 2800],
            pose(e, t) {
              const from = e.punish.fromX;
              const to = e.punish.toNX * W;
              const head = spriteTop(e.characterId);
              const grab = GROUND - 16 + head;
              const top = 34;
              if (t < 700)
                return {
                  cx: from,
                  cy: lerp(-6, grab, ease(phase(t, 0, 700))),
                  foot: GROUND,
                  open: true,
                };
              if (t < 900) return { cx: from, cy: grab, foot: GROUND, open: false };
              if (t < 1400) {
                const cy = lerp(grab, top, ease(phase(t, 900, 1400)));
                return { cx: from, cy, foot: cy + 16 - head, open: false };
              }
              if (t < 2400) {
                return {
                  cx: lerp(from, to, ease(phase(t, 1400, 2400))),
                  cy: top,
                  foot: top + 16 - head,
                  open: false,
                };
              }
              const k = phase(t, 2400, 2800);
              const foot = top + 16 - head + (GROUND - top - 16 + head) * k * k;
              return { cx: to, cy: lerp(top, -6, phase(t, 2500, 3000)), foot, open: true };
            },
            anchor(e, t) {
              const p = this.pose(e, t);
              return { x: p.cx, top: Math.min(p.cy - 8, p.foot - 16) };
            },
            draw(e, t, now) {
              const p = this.pose(e, t);
              const lifted = t >= 900 && t < 2400;
              drawChar(e, p.cx, p.foot, lifted ? Math.floor(now / 120) % 2 : 0);
              drawClaw(p.cx, p.cy, p.open);
            },
          },

          lightning: {
            duration: 2400,
            shake: [150, 450],
            text: '야근 확정!',
            textAt: [500, 1900],
            anchor: (e, t) => ({
              x: t < 1700 ? e.punish.fromX : e.punish.toNX * W,
              top: GROUND - 34,
            }),
            draw(e, t, now) {
              const x = e.punish.fromX;
              const to = e.punish.toNX * W;
              if (t < 500) return drawChar(e, x, GROUND);
              if (t < 1600) {
                ctx.drawImage(charred(e.characterId, e.facing), Math.round(x - 8), GROUND - 16);
                for (let i = 0; i < 3; i++) {
                  const k = ((t - 500) / 700 + i / 3) % 1;
                  ctx.globalAlpha = 1 - k;
                  rect(
                    Math.round(x - 4 + i * 3 + Math.sin(now / 100 + i)),
                    Math.round(GROUND - 18 - k * 14),
                    3,
                    3,
                    '#8a8f98',
                  );
                }
                ctx.globalAlpha = 1;
                return;
              }
              if (t < 1900) return drawPoof(x, phase(t, 1600, 1900));
              if (t >= 2100) drawChar(e, to, GROUND, 0, -1);
              drawPoof(to, 1 - phase(t, 1900, 2400));
            },
            overlay(e, t) {
              if (t < 1600)
                rect(-4, -4, W + 8, H + 8, `rgba(10,10,40,${0.45 * Math.min(1, t / 150)})`);
              if (t >= 150 && t < 500 && Math.floor(t / 60) % 2 === 0)
                drawBolt(Math.round(e.punish.fromX), GROUND - 16 + spriteTop(e.characterId));
              if (t < 150) rect(-4, -4, W + 8, H + 8, `rgba(255,255,255,${0.8 * (1 - t / 150)})`);
            },
          },

          issue: {
            duration: 2600,
            text: '이슈 터졌다!!!',
            textAt: [0, 2400],
            pose(e, t) {
              const from = e.punish.fromX;
              const to = e.punish.toNX * W;
              if (t < 500) return { x: from, y: -12 * Math.sin((Math.PI * t) / 500) };
              if (t < 2200) return { x: lerp(from, to, ease(phase(t, 500, 2200))), y: 0 };
              return { x: to, y: 0 };
            },
            anchor(e, t) {
              const p = this.pose(e, t);
              return { x: p.x, top: GROUND - 36 + p.y };
            },
            draw(e, t, now) {
              const { x, y } = this.pose(e, t);
              const running = t >= 500 && t < 2200;
              drawChar(e, x, GROUND + y, running ? Math.floor(now / 60) % 2 : 0, t < 2200 ? 1 : -1);
              if (t < 700) {
                rect(Math.round(x - 1), Math.round(GROUND - 30 + y), 2, 6, '#e43b44');
                rect(Math.round(x - 1), Math.round(GROUND - 22 + y), 2, 2, '#e43b44');
              }
              if (running) {
                rect(
                  Math.round(x - 7),
                  Math.round(GROUND - 15 + (Math.floor(now / 90) % 3)),
                  2,
                  3,
                  '#7fd3ff',
                );
                for (let i = 0; i < 4; i++) {
                  const k = (now / 300 + i / 4) % 1;
                  ctx.globalAlpha = 1 - k;
                  rect(
                    Math.round(x - 10 - k * 12),
                    Math.round(GROUND - 3 - k * 5),
                    3,
                    3,
                    '#d8c8a8',
                  );
                }
                ctx.globalAlpha = 1;
              }
            },
            overlay(e, t, now) {
              if (t >= 2400) return;
              rect(-4, -4, W + 8, H + 8, `rgba(255,30,30,${0.12 + 0.1 * Math.sin(now / 90)})`);
              const blink = Math.floor(now / 150) % 2;
              const ox = W - 100;
              rect(ox + 4, GROUND - 82, 8, 6, blink ? '#ff2020' : '#ff9a9a');
              rect(ox + 72, GROUND - 82, 8, 6, blink ? '#ff9a9a' : '#ff2020');
              rect(ox + 3, GROUND - 77, 10, 2, '#3d4450');
              rect(ox + 71, GROUND - 77, 10, 2, '#3d4450');
            },
          },

          bungee: {
            duration: 2600,
            text: '어딜 도망가~',
            textAt: [300, 2300],
            pose(e, t) {
              const from = e.punish.fromX;
              const to = e.punish.toNX * W;
              if (t < 800) {
                const jitter = t >= 500 ? (Math.floor(t / 40) % 2 ? 1 : -1) : 0;
                return { x: from + jitter, y: 0, rot: 0 };
              }
              if (t < 1900) {
                const k = ease(phase(t, 800, 1900));
                return {
                  x: lerp(from, to, k),
                  y: -46 * Math.sin(Math.PI * k),
                  rot: k * Math.PI * 4,
                };
              }
              return { x: to, y: 0, rot: 0 };
            },
            anchor(e, t) {
              const p = this.pose(e, t);
              return { x: p.x, top: GROUND - 34 + p.y };
            },
            draw(e, t) {
              const p = this.pose(e, t);
              const waistY = GROUND - 8 + p.y;
              if (t < 1900) {
                const tipX = t < 500 ? lerp(doorX(), p.x, phase(t, 0, 500)) : p.x;
                ctx.strokeStyle = '#ff5d8f';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(doorX(), GROUND - 8);
                ctx.lineTo(tipX, t < 500 ? GROUND - 8 : waistY);
                ctx.stroke();
              }
              const img = sprite(e.characterId, 0, -1);
              if (t >= 800 && t < 1900) {
                ctx.save();
                ctx.translate(Math.round(p.x), Math.round(waistY));
                ctx.rotate(p.rot);
                ctx.drawImage(img, -8, -8);
                ctx.restore();
              } else if (t >= 1900) {
                const h = Math.round(16 - 6 * Math.sin(Math.PI * phase(t, 1900, 2300)));
                const w = 32 - h;
                ctx.drawImage(img, Math.round(p.x - w / 2), GROUND - h, w, h);
              } else {
                drawChar(e, p.x, GROUND, 0, -1);
              }
              if (t >= 500 && t < 1900) {
                ctx.save();
                ctx.translate(Math.round(p.x), Math.round(waistY));
                ctx.rotate(p.rot);
                rect(-6, -1, 12, 2, '#ff5d8f');
                ctx.restore();
              }
            },
          },
        };
        const EFFECT_NAMES = Object.keys(EFFECTS);

        function drawEntity(e, now) {
          if (e.punish) return EFFECTS[e.punish.effect].draw(e, now - e.punish.start, now);
          if (e.blinkUntil > now && Math.floor(now / 100) % 2) return;
          const frame = e.walking && Math.floor(now / 160) % 2 ? 1 : 0;
          const x = Math.round(e.x - 8);
          const y = Math.round(GROUND - 16 + e.y);
          rect(x + 3, GROUND - 1, 10, 1, 'rgba(0,0,0,0.25)');
          ctx.drawImage(sprite(e.characterId, frame, e.facing), x, y);
          if (e.isMe) {
            ctx.fillStyle = '#ffd23f';
            ctx.beginPath();
            ctx.moveTo(e.x - 2, y - 4);
            ctx.lineTo(e.x + 2, y - 4);
            ctx.lineTo(e.x, y - 2);
            ctx.fill();
          }
        }

        // 붐빌 때 이름표가 겹치면 건너뛴다. 내 이름표 → 말풍선 있는 사람 → 나머지 순으로 우선.
        function drawNameTags(list) {
          setFont(5, 'bold');
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          const order = [...list].sort((a, b) => b.isMe - a.isMe || !!b.bubble - !!a.bubble);
          const taken = [];
          for (const e of order) {
            const nw = ctx.measureText(e.name).width;
            const l = Math.round(e.x - nw / 2 - 5);
            const r = l + Math.ceil(nw) + 9;
            if (taken.some(([a, b]) => l < b + 1 && r > a - 1)) continue;
            taken.push([l, r]);
            rect(l, GROUND + 6, r - l, 7, 'rgba(14,20,48,0.75)');
            rect(l + 2, GROUND + 8, 3, 3, e.status === 'online' ? '#3fdc5a' : '#8a8f98');
            ctx.fillStyle = e.isMe ? '#ffd23f' : '#ffffff';
            ctx.fillText(e.name, e.x + 2, GROUND + 7);
          }
        }

        function draw(now, dt) {
          let shake = 0;
          const active = [...entities.values()].filter((e) => e.punish);
          for (const e of active) {
            const t = now - e.punish.start;
            const sh = EFFECTS[e.punish.effect].shake;
            if (sh && t >= sh[0] && t < sh[1]) shake = 2;
          }
          const ox = shake ? Math.round(rand(-shake, shake)) : 0;
          const oy = shake ? Math.round(rand(-shake, shake)) : 0;
          ctx.setTransform(px, 0, 0, px, ox * px, oy * px);
          ctx.imageSmoothingEnabled = false;
          const { sky, night } = skyColors();
          rect(-4, -4, W + 8, H + 8, sky);
          if (night)
            for (const [sx, sy] of stars) rect(Math.floor(sx * W), Math.floor(sy), 1, 1, '#fff');
          for (const c of clouds) {
            c.x += c.s * dt;
            if (c.x > W + 10) c.x = -30;
            if (!night) drawCloud(Math.round(c.x), Math.round(c.y));
          }
          drawHills();
          drawHouse(night);
          drawOffice(night);
          const r0 = zones.home()[1] + 20;
          const r1 = zones.office()[0] - 30;
          for (let x = r0; x < r1; x += 70) drawTree(x);
          drawGround();

          const list = [...entities.values()].sort((a, b) => a.isMe - b.isMe || a.x - b.x);
          list.forEach((e) => drawEntity(e, now));
          drawNameTags(list.filter((e) => !e.punish));
          list.forEach((e) => e.bubble && !e.punish && drawBubble(e));
          for (const e of active) {
            const fx = EFFECTS[e.punish.effect];
            const t = now - e.punish.start;
            if (fx.overlay) fx.overlay(e, t, now);
            const [a, b] = fx.textAt;
            if (t >= a && t < b) drawBanner(fx.text, fx.anchor(e, t));
          }

          if (document.activeElement !== canvas && !chatting) {
            setFont(6, 'bold');
            const msg = '▶ 클릭해서 조작하기';
            const w = ctx.measureText(msg).width + 8;
            rect(Math.round(W / 2 - w / 2), 3, Math.round(w), 9, 'rgba(14,20,48,0.8)');
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(msg, W / 2, 8);
          }
        }

        let last = performance.now();
        function loop(now) {
          const dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          for (const e of entities.values()) step(e, dt, now);
          syncMe(now);
          draw(now, dt);
          renderBar();
          requestAnimationFrame(loop);
        }

        // ───────── 데모 모드 ─────────
        const DEMO_LINES = [
          '커피 한잔?',
          '점심 뭐 먹지',
          '퇴근하고 싶다',
          '회의 5분 전!',
          '배포 완료 🎉',
          '오늘도 화이팅',
        ];
        function startDemo() {
          [
            { id: 'kim', name: '김하늘', status: 'online', characterId: 'worker-red' },
            { id: 'lee', name: '이바다', status: 'online', characterId: 'shroom-red' },
            { id: 'park', name: '박구름', status: 'offline', characterId: 'turtle-green' },
            { id: 'choi', name: '최별', status: 'online', characterId: 'cat-orange' },
            { id: 'jung', name: '정숲', status: 'offline', characterId: 'robot-silver' },
            { id: 'kang', name: '강산', status: 'online', characterId: 'penguin-blue' },
          ].forEach(upsert);
          setInterval(() => {
            const others = [...entities.values()].filter((e) => !e.isMe);
            const e = others[Math.floor(Math.random() * others.length)];
            if (!e) return;
            if (Math.random() < 0.4) setStatus(e, e.status === 'online' ? 'offline' : 'online');
            else say(e, DEMO_LINES[Math.floor(Math.random() * DEMO_LINES.length)]);
          }, 6000);
        }

        // ───────── 시작 ─────────
        // 존 좌표가 화면 폭(W)에 의존하므로 엔티티 생성 전에 크기부터 확정한다
        resize();
        upsert({ id: ME, name: ME === 'me' ? '나' : ME, status: 'online' });
        const saved = storedChar();
        if (saved) entities.get(ME).characterId = saved;
        new ResizeObserver(resize).observe(root);
        if (DEMO) startDemo();
        connect();
        requestAnimationFrame(loop);

        // 테스트/디버깅용 읽기 전용 스냅샷
        window.__pixelOffice = {
          getState() {
            return JSON.parse(
              JSON.stringify({
                me: ME,
                width: W,
                connected,
                focused: document.activeElement === canvas,
                chatting,
                characters: CHARACTERS.map((c) => c.id),
                effects: EFFECT_NAMES,
                entities: [...entities.values()].map((e) => ({
                  id: e.id,
                  name: e.name,
                  status: e.status,
                  characterId: e.characterId,
                  x: e.x,
                  zone: zoneOf(e.x),
                  bubble: e.bubble ? e.bubble.text : null,
                  punished: !!e.punish,
                  effect: e.punish ? e.punish.effect : null,
                })),
              }),
            );
          },
        };
      })();
    </script>
  </body>
</html>
